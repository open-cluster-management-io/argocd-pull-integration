# Controller manager image settings
# For development (main branch): use "latest" tag
# For release branches: update tag to match the release version (e.g., "0.26.1")
image: quay.io/open-cluster-management/argocd-pull-integration
tag: latest
replicas: 1

# ArgoCD operator image.
# Authoritative version lives in Makefile ARGOCD_OPERATOR_IMAGE (injected into
# the Go binary via ldflags). These Helm defaults MUST match the Makefile value.
# The release workflow updates the tag automatically for tagged releases.
operatorImage: quay.io/argoprojlabs/argocd-operator
operatorImageTag: v0.18.0

# Image pull secrets applied to the controller and argocd-operator
# Deployments, for pulling images from private registries.
imagePullSecrets: []

# Principal service type: LoadBalancer for production (cloud LB),
# NodePort for local dev (e.g. kind) - override via --set principalServiceType=NodePort
principalServiceType: LoadBalancer

# Hub ArgoCD settings
global:
  argoCDOperatorNamespace: argocd-operator-system
  argoCDNamespace: argocd

# Hub ArgoCD installation. Disable when adopting a pre-existing argocd-operator-managed
# Argo CD instance on the hub (with spec.argoCDAgent.principal already enabled). When
# disabled, this chart still installs the GitOpsCluster controller, placement, and
# ClusterManagementAddOn, but skips installing argocd-operator and the hub ArgoCD CR.
hubArgoCD:
  enabled: true

# argocd-agent image shared by the hub principal (this chart's ArgoCD CR, when
# hubArgoCD.enabled) and, by default, the managed-cluster agent (propagated via the
# GitOpsCluster CR's spec.argoCDAgentAddon.agentImage). Keeping both on the same image
# is required: mismatched principal/agent versions fail the argocd-agent version
# handshake. Leave empty to fall back to whatever argocd-operator defaults to.
argoCDAgent:
  image: quay.io/argoprojlabs/argocd-agent:v0.9.0

# GitOpsCluster settings (will be created in argocd namespace)
gitOpsCluster:
  namespace: argocd
  name: gitops-cluster
  principalServerAddress: ""
  principalServerPort: ""
  mode: managed
  argoCDAgentAddon:
    agentNamespace: ""
    operatorNamespace: ""
  # When customArgoCDCR is enabled, a user-provided ArgoCD CR is included in the
  # GitOpsCluster spec.argoCDAgentAddon.argoCDCRManifestWork field. The controller
  # will deliver this exact CR via ManifestWork instead of auto-generating a default.
  customArgoCDCR:
    enabled: false

# Controller settings  
controller:
  namespace: argocd
